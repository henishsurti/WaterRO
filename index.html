<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5E73">
<meta name="description" content="AquaFlow professional RO service, AMC and field technician management platform">
<title>AquaFlow — RO Service &amp; AMC Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AquaFlow — design tokens
   Typography: Manrope (display/headings) + Inter (body/UI text)
   ===================================================================== */
:root{
  /* --- color: light --- */
  --bg:#F3F7F9; --surface:#FFFFFF; --surface-2:#EDF3F5; --surface-3:#E3ECEE;
  --ink:#0D2129; --ink-muted:#5C7580; --ink-faint:#8CA0A8; --border:#DCE6E9; --border-soft:#E8EFF1;
  --teal:#0B5E73; --teal-dark:#073B49; --teal-deep:#052A34; --aqua:#0EA5B7; --aqua-soft:#DFF4F6; --aqua-tint:#F0FAFB;
  --amber:#A85F0C; --amber-soft:#FBEBD3;
  --red:#B23327; --red-soft:#FBE4E1;
  --green:#187645; --green-soft:#E0F3E7;
  --slate:#64747A; --slate-soft:#EDF1F2;
  --shadow-xs: 0 1px 2px rgba(13,33,41,.05);
  --shadow-sm: 0 1px 2px rgba(13,33,41,.05), 0 3px 10px rgba(13,33,41,.05);
  --shadow-md: 0 2px 6px rgba(13,33,41,.06), 0 10px 26px rgba(13,33,41,.08);
  --shadow-lg: 0 8px 24px rgba(13,33,41,.10), 0 24px 48px rgba(13,33,41,.12);
  --focus: 0 0 0 3px rgba(14,165,183,.22);
  --r-sm:7px; --r-md:11px; --r-lg:16px; --r-xl:22px; --r-full:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:36px; --sp-8:48px;
  --dur-fast:.12s; --dur-base:.18s; --dur-slow:.32s;
  --ease: cubic-bezier(.22,.9,.3,1);
  --font-head: 'Manrope', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0A171C; --surface:#0F2027; --surface-2:#0D1D23; --surface-3:#122A32;
  --ink:#E6F0F2; --ink-muted:#8FA6AD; --ink-faint:#5E747B; --border:#1C363E; --border-soft:#17282E;
  --teal:#3FA9C0; --teal-dark:#0B5E73; --teal-deep:#0EA5B7; --aqua:#2FC3D6; --aqua-soft:#0F2C32; --aqua-tint:#0C2428;
  --amber:#E0A44C; --amber-soft:#2C2011;
  --red:#E27A6D; --red-soft:#2C1714;
  --green:#5FCB8F; --green-soft:#11281C;
  --slate:#8798A0; --slate-soft:#142428;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.28);
  --shadow-md: 0 2px 8px rgba(0,0,0,.34), 0 14px 30px rgba(0,0,0,.32);
  --shadow-lg: 0 10px 26px rgba(0,0,0,.38), 0 30px 60px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0A171C; --surface:#0F2027; --surface-2:#0D1D23; --surface-3:#122A32;
    --ink:#E6F0F2; --ink-muted:#8FA6AD; --ink-faint:#5E747B; --border:#1C363E; --border-soft:#17282E;
    --teal:#3FA9C0; --teal-dark:#0B5E73; --teal-deep:#0EA5B7; --aqua:#2FC3D6; --aqua-soft:#0F2C32; --aqua-tint:#0C2428;
    --amber:#E0A44C; --amber-soft:#2C2011;
    --red:#E27A6D; --red-soft:#2C1714;
    --green:#5FCB8F; --green-soft:#11281C;
    --slate:#8798A0; --slate-soft:#142428;
    --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.28);
    --shadow-md: 0 2px 8px rgba(0,0,0,.34), 0 14px 30px rgba(0,0,0,.32);
    --shadow-lg: 0 10px 26px rgba(0,0,0,.38), 0 30px 60px rgba(0,0,0,.4);
  }
}

/* =====================================================================
   Base
   ===================================================================== */
*{box-sizing:border-box;}
html,body{height:100%;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
h1,h2,h3,h4,.head{font-family:var(--font-head); font-weight:800; letter-spacing:-0.015em; color:var(--ink);}
a{color:inherit;}
button{font-family:inherit;}
svg{display:block;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::selection{background:var(--aqua-soft); color:var(--teal-dark);}

button,a,input,select,textarea{transition:box-shadow var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease), background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease), color var(--dur-base) var(--ease), opacity var(--dur-base) var(--ease);}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:none; box-shadow:var(--focus); border-radius:6px;}
button:disabled{opacity:.45; cursor:not-allowed;}

#app{min-height:100%; height:100%;}
.hidden{display:none !important;}

@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes slideUp{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@keyframes popIn{from{transform:scale(.97); opacity:0;} to{transform:scale(1); opacity:1;}}
.view-enter{animation:fadeUp .28s var(--ease);}

/* =====================================================================
   Login
   ===================================================================== */
.af-login{min-height:100vh; display:grid; grid-template-columns:minmax(0,1.08fr) minmax(400px,.72fr); background:var(--bg); animation:fadeIn .3s var(--ease);}
.af-login-hero{
  position:relative; overflow:hidden; padding:clamp(32px,6vw,80px); display:flex; flex-direction:column; justify-content:space-between; color:#fff;
  background:
    radial-gradient(680px 420px at 14% 8%, rgba(255,255,255,.10), transparent 60%),
    radial-gradient(520px 420px at 92% 88%, rgba(255,255,255,.08), transparent 55%),
    linear-gradient(155deg, var(--teal-deep) 0%, var(--teal-dark) 48%, var(--teal) 82%, var(--aqua) 130%);
}
.af-login-hero::before{content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 42px);
}
.af-login-hero .ripple{position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.14); pointer-events:none;}
.af-login-hero .ripple.r1{width:520px; height:520px; right:-200px; top:-200px;}
.af-login-hero .ripple.r2{width:340px; height:340px; right:-90px; top:-90px;}
.af-login-hero .ripple.r3{width:300px; height:300px; left:-140px; bottom:-120px;}
.af-login-brand{position:relative; z-index:1; display:flex; align-items:center; gap:13px;}
.af-login-brand .logo{width:48px;height:48px;border-radius:var(--r-md);background:#fff;color:var(--teal-dark);display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.22);}
.af-login-brand .logo svg{width:26px;height:26px;}
.af-login-brand .brand{font:800 21px var(--font-head); letter-spacing:-.01em;}
.af-login-brand .sub{font-size:12px; color:rgba(255,255,255,.72); font-weight:500; margin-top:1px;}
.af-login-copy{position:relative; z-index:1; max-width:640px; margin-top:var(--sp-8);}
.af-login-copy .eyebrow{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); border-radius:var(--r-full); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;}
.af-login-copy h1{font-size:clamp(32px,4.4vw,52px); line-height:1.06; color:#fff; margin:20px 0 14px; max-width:11ch; font-weight:800; letter-spacing:-.02em;}
.af-login-copy p{max-width:52ch; color:rgba(255,255,255,.78); font-size:15px; line-height:1.6;}
.af-feature-grid{position:relative; z-index:1; display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-top:var(--sp-6);}
.af-feature{padding:14px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.065); border-radius:var(--r-md); backdrop-filter:blur(2px);}
.af-feature strong{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700;}
.af-feature strong .ico svg{width:15px!important;height:15px!important;}
.af-feature span{display:block; font-size:11px; color:rgba(255,255,255,.66); margin-top:4px; line-height:1.4;}

.af-login-panel{display:flex; align-items:center; justify-content:center; padding:36px; background:var(--surface);}
.af-login-card{width:min(420px,100%); animation:fadeUp .4s var(--ease) .05s both;}
.af-login-head h2{margin:0; font-size:26px;}
.af-login-head p{margin:7px 0 24px; color:var(--ink-muted); font-size:13.5px;}
.af-role-toggle{display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--surface-2); padding:5px; border-radius:var(--r-md); margin-bottom:20px;}
.af-role-toggle button{border:0; background:transparent; color:var(--ink-muted); padding:10px; border-radius:8px; font-weight:700; font-size:12.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;}
.af-role-toggle button svg{width:15px!important;height:15px!important;}
.af-role-toggle button.active{background:var(--surface); color:var(--teal); box-shadow:var(--shadow-sm);}
.af-login-card .field{margin-bottom:15px;}
.af-login-card .field label{color:var(--ink);}
.af-password{position:relative;}
.af-password input{padding-right:46px;}
.af-password .icon-btn{position:absolute; right:5px; top:5px; border:0; background:transparent; width:34px; height:34px;}
.af-login-submit{width:100%; justify-content:center; height:46px; font-size:14px; letter-spacing:.01em;}
.af-demo{margin-top:16px; padding:12px 13px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); font-size:11.5px; color:var(--ink-muted); line-height:1.7;}
.af-demo strong{color:var(--ink); font-weight:700;}
.af-login-footer{text-align:center; margin-top:20px; color:var(--ink-faint); font-size:11px;}
@media(max-width:900px){
  .af-login{grid-template-columns:1fr;}
  .af-login-hero{min-height:300px; padding:30px;}
  .af-login-copy{margin-top:var(--sp-5);}
  .af-login-copy h1{font-size:34px; max-width:none;}
  .af-feature-grid{max-width:560px; margin-top:var(--sp-4);}
  .af-login-panel{min-height:calc(100vh - 300px); padding:28px 20px;}
}
@media(max-width:520px){
  .af-feature-grid{grid-template-columns:1fr;}
  .af-feature:nth-child(3){display:none;}
  .af-login-hero{min-height:260px;}
  .af-login-copy p{font-size:13.5px;}
  .af-login-card{max-width:100%;}
}

/* =====================================================================
   Admin shell
   ===================================================================== */
.admin-shell{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
@media (max-width:900px){.admin-shell{grid-template-columns:1fr;}}
.sidebar{
  background:linear-gradient(185deg, var(--teal-dark), var(--teal-deep)); color:#EAF4F6; padding:var(--sp-5) var(--sp-3);
  position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column;
  padding-top: calc(var(--sp-5) + env(safe-area-inset-top, 0px));
}
@media (max-width:900px){
  .sidebar{position:fixed; left:0; top:0; height:100dvh; width:264px; z-index:41; transform:translateX(-106%); transition:transform var(--dur-slow) var(--ease); box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
}
.sidebar-backdrop{display:none;}
@media (max-width:900px){.sidebar-backdrop.open{display:block; position:fixed; inset:0; background:rgba(4,14,18,.5); backdrop-filter:blur(1px); z-index:40; animation:fadeIn var(--dur-base) var(--ease);}}
.sb-brand{display:flex; align-items:center; gap:11px; padding:6px 10px 22px;}
.sb-brand .ico{width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.12); display:grid; place-items:center; flex:0 0 auto;}
.sb-brand .ico svg{width:17px!important;height:17px!important;}
.sb-brand span{font-family:var(--font-head); font-weight:800; font-size:16px; color:#fff; letter-spacing:-.01em;}
.sb-nav{display:flex; flex-direction:column; gap:2px; flex:1;}
.sb-item{
  display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:var(--r-sm); cursor:pointer;
  color:#B7D6DB; font-size:13.3px; font-weight:600; border:none; background:transparent; text-align:left; width:100%; position:relative;
}
.sb-item svg{width:17px!important;height:17px!important; flex:0 0 17px; opacity:.85;}
.sb-item:hover{background:rgba(255,255,255,.07); color:#fff;}
.sb-item.active{background:rgba(255,255,255,.98); color:var(--teal-deep); font-weight:700;}
.sb-item.active svg{opacity:1;}
.sb-foot{margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; gap:2px;}
.sb-user{display:flex; align-items:center; gap:10px; padding:8px 10px 14px;}
.sb-user .av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font:800 12px var(--font-head); flex:0 0 auto;}
.sb-user .who{min-width:0;}
.sb-user .n{color:#fff; font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sb-user .r{color:#9FC4CA; font-size:11px; text-transform:capitalize;}

.main{min-width:0;}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--surface); background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:14px 24px; gap:10px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
}
.topbar .title{font-size:20px;}
.topbar .titlewrap{display:flex; align-items:center; gap:12px; min-width:0;}
.topbar .actions{display:flex; align-items:center; gap:8px;}
.hamburger-btn{display:none;}
@media (max-width:900px){.hamburger-btn{display:inline-flex;}}
.content{padding:24px; max-width:1320px;}
@media (max-width:640px){.content{padding:14px;}}
.topbar-avatar{width:32px;height:32px;border-radius:50%;background:var(--aqua-soft);color:var(--teal);display:grid;place-items:center;font:800 12px var(--font-head); flex:0 0 auto; border:1px solid var(--border);}

/* =====================================================================
   Technician shell (mobile-first)
   ===================================================================== */
.tech-shell{max-width:520px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}
.tech-top{
  position:sticky; top:0; z-index:6; color:#fff; padding:15px 18px;
  background:linear-gradient(120deg, var(--teal-deep), var(--teal-dark) 60%, var(--teal));
  padding-top: calc(15px + env(safe-area-inset-top, 0px));
  display:flex; align-items:center; justify-content:space-between;
}
.tech-top .who-row{display:flex; align-items:center; gap:11px;}
.tech-top .av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font:800 13px var(--font-head); flex:0 0 auto;}
.tech-top .who{font-size:11.5px; color:#BFE1E6; font-weight:600;}
.tech-top .name{font-family:var(--font-head); font-weight:800; font-size:16px; letter-spacing:-.01em;}
.tech-body{flex:1; padding:16px 14px 96px; overflow-y:auto;}
.tech-bottom{
  position:sticky; bottom:0; background:var(--surface); background:color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--border);
  display:flex; justify-content:space-around; padding:7px 4px;
  padding-bottom: calc(7px + env(safe-area-inset-bottom, 0px));
}
.tb-item{display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-weight:700; padding:7px 12px; border-radius:12px;}
.tb-item.active{color:var(--teal); background:var(--aqua-soft);}
.tb-item svg{width:19px!important;height:19px!important;}

/* =====================================================================
   Core components
   ===================================================================== */
.cards-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:12px; margin-bottom:22px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:15px 16px; box-shadow:var(--shadow-xs); position:relative; overflow:hidden; padding-left:19px;}
.stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--border);}
.stat-card .label{color:var(--ink-muted); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.045em;}
.stat-card .value{font-family:var(--font-head); font-size:25px; font-weight:800; margin-top:6px; letter-spacing:-.02em;}
.stat-card .sub{font-size:11.5px; color:var(--ink-muted); margin-top:4px;}
.stat-card.warn::before{background:var(--amber);} .stat-card.warn .value{color:var(--amber);}
.stat-card.danger::before{background:var(--red);} .stat-card.danger .value{color:var(--red);}
.stat-card.good::before{background:var(--green);} .stat-card.good .value{color:var(--green);}

.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-xs); margin-bottom:18px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px;}
.panel-head h2{font-size:15px; margin:0; letter-spacing:-.01em;}
.panel-body{padding:18px;}
.panel-body.pad0{padding:0;}

.btn{
  display:inline-flex; align-items:center; gap:6px; border-radius:var(--r-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--ink); font-size:13px; font-weight:700; padding:8px 14px; cursor:pointer; letter-spacing:-.005em;
}
.btn:hover{border-color:var(--teal); color:var(--teal);}
.btn:active{transform:scale(.97);}
.btn svg{width:14px!important;height:14px!important; flex:0 0 14px;}
.btn.primary{background:var(--teal); border-color:var(--teal); color:#fff; box-shadow:0 1px 2px rgba(11,94,115,.15), 0 6px 16px rgba(11,94,115,.18);}
.btn.primary:hover{background:var(--teal-dark); border-color:var(--teal-dark); color:#fff;}
.btn.danger{color:var(--red); border-color:var(--red-soft);}
.btn.danger:hover{background:var(--red-soft); border-color:var(--red-soft); color:var(--red);}
.btn.ghost{border-color:transparent; background:transparent;}
.btn.ghost:hover{background:var(--surface-2);}
.btn.sm{padding:6px 10px; font-size:12px;}
.btn.block{width:100%; justify-content:center;}
.btn.big{padding:14px 18px; font-size:14.5px; border-radius:var(--r-md);}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--ink-muted); position:relative; line-height:0; overflow:visible;}
.icon-btn:hover{color:var(--teal); border-color:var(--teal);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:18px!important;height:18px!important; display:block; flex:0 0 18px; overflow:visible;}
.icon-btn[title]::after{content:attr(title); position:absolute; bottom:-34px; left:50%; transform:translateX(-50%) translateY(-3px); background:var(--teal-deep); color:#fff; font-size:11px; font-weight:700; padding:5px 9px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; z-index:100; transition:.14s;}
.icon-btn[title]:hover::after{opacity:1; transform:translateX(-50%) translateY(0);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; padding:10px 14px; color:var(--ink-muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:11px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.row-link{cursor:pointer;}
.row-link:hover td{background:var(--surface-2);}
.muted{color:var(--ink-muted);}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3.5px 10px; border-radius:var(--r-full); font-size:11px; font-weight:700; white-space:nowrap; letter-spacing:.01em;}
.badge.b-slate{background:var(--slate-soft); color:var(--slate);}

    {code:'TECH-002', name:'Iqbal Sheikh', mobile:'9898003344', email:'iqbal.s@aquaflow.in'}
  ];
  const techIdMap = {};
  canonical.forEach((base,idx)=>{
    const oldIds = idx===0 ? ['tech-1','tech-001'] : ['tech-2','tech-002'];
    let t = DB.technicians.find(x=>x.code===base.code) || DB.technicians.find(x=>x.id===oldIds[0]) || DB.technicians.find(x=>x.name===base.name);
    if(!t){ t={id:oldIds[0],status:'Active'}; DB.technicians.push(t); }

    techIdMap[base.code]=t.id;
    // Repoint service/user records from legacy duplicate IDs to the canonical ID.
    DB.services = Array.isArray(DB.services) ? DB.services : [];
    oldIds.forEach(oldId=>{ DB.services.forEach(svc=>{ if(svc.technicianId===oldId) svc.technicianId=t.id; }); });

  });
  // Remove duplicate demo technicians left by older migrations, preserving referenced canonical records.
  const keepIds=new Set(Object.values(techIdMap));
  DB.technicians = DB.technicians.filter(t=>!['tech-001','tech-002'].includes(t.id) || keepIds.has(t.id));
  canonical.forEach((base,idx)=>{

}

function load(){
  try{

    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.notificationsRead) parsed.notificationsRead = {};
      if(!parsed.notificationsDismissed) parsed.notificationsDismissed = {};
      if(!parsed.settings) parsed.settings = seedData().settings;
      if(parsed.settings.pushEnabled === undefined) parsed.settings.pushEnabled = true;
      return parsed;
    }
  }catch(e){ /* storage unavailable */ }
  const seeded = seedData();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded)); }catch(e){}
  return seeded;
}

/* ============================= TOAST ============================= */
function toast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2200);
}
function pushToast(title, msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className='push-toast';
  el.innerHTML = `<button class="pt-close" data-action="close-push-toast" title="Close notification">${ICONS.x}</button><div class="pt-icon">${ICONS.bell}</div><div><div class="pt-title">${title}</div><div class="pt-msg">${msg}</div></div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 4500);
}

function requestPushPermission(){
  try{
    if(typeof Notification==='undefined'){ toast('Browser notifications are not available in this preview'); return; }
    Notification.requestPermission().then(perm=>{
      if(perm==='granted') toast('Browser notifications enabled'); else toast('Notifications not allowed — in-app reminders will still show');

  }catch(e){ toast('Browser notifications are not available in this preview'); }
}

function maybeShowPushReminders(){
  if(!DB.settings.pushEnabled) return;
  const dueTodayUnread = buildNotifications().filter(n=>n.dueToday && !n.read);
  if(!dueTodayUnread.length) return;
  dueTodayUnread.slice(0,4).forEach((n,i)=>{
    setTimeout(()=>{
      pushToast(n.title, n.msg);
      try{
        if(typeof Notification!=='undefined' && Notification.permission==='granted'){
          new Notification(n.title, {body:n.msg});
        }
      }catch(e){ /* notifications unavailable in this context */ }
    }, i*350);
  });
}

/* ============================= STATUS HELPERS ============================= */
function amcStatus(amc){
  if(amc.status==='Cancelled') return 'Cancelled';
  const d = daysDiff(amc.endDate);
  if(d<0) return 'Expired';
  if(d<=30) return 'Expiring Soon';
  if(amc.status==='Draft') return 'Draft';
  return 'Active';
}
function amcBadge(amc){
  const s = amcStatus(amc);
  const map = {Active:'b-green', 'Expiring Soon':'b-amber', Expired:'b-red', Cancelled:'b-slate', Draft:'b-slate'};
  return `<span class="badge ${map[s]}">${s}</span>`;
}
function serviceBadge(svc){
  const map = {New:'b-slate', Pending:'b-slate', Scheduled:'b-teal', Assigned:'b-teal', 'On the Way':'b-teal', 'In Progress':'b-amber', 'Waiting for Parts':'b-amber', Completed:'b-green', Cancelled:'b-red', Rescheduled:'b-amber', 'Customer Not Available':'b-red'};
  let extra='';
  if(!['Completed','Cancelled'].includes(svc.status) && svc.dueDate && daysDiff(svc.dueDate)<0) extra=' (Overdue)';
  return `<span class="badge ${map[svc.status]||'b-slate'}">${svc.status}${extra}</span>`;
}
function roStatusBadge(ro){

}
function isOverdue(svc){ return !['Completed','Cancelled'].includes(svc.status) && svc.dueDate && daysDiff(svc.dueDate)<0; }
function isDueToday(svc){ return !['Completed','Cancelled'].includes(svc.status) && svc.dueDate===todayISO(); }
function isDueTomorrow(svc){ const t=new Date(); t.setDate(t.getDate()+1); return !['Completed','Cancelled'].includes(svc.status) && svc.dueDate===t.toISOString().slice(0,10); }

/* ============================= NOTIFICATIONS ENGINE ============================= */
function buildNotifications(){
  const list = [];
  DB.services.forEach(s=>{
    if(['Completed','Cancelled'].includes(s.status) || !s.dueDate) return;
    const d = daysDiff(s.dueDate);
    if(d<0) list.push({sev:'danger', icon:'wrench', title:'Service overdue', msg:`${custName(s.customerId)} — ${s.type} was due ${fmtDate(s.dueDate)}`, date:s.dueDate, ref:s.id, kind:'service', dueToday:false});
    else if(d===0) list.push({sev:'amber', icon:'wrench', title:'Service due today', msg:`${custName(s.customerId)} — ${s.type}, tech: ${techName(s.technicianId)}`, date:s.dueDate, ref:s.id, kind:'service', dueToday:true});
    else if(d===1) list.push({sev:'teal', icon:'wrench', title:'Service due tomorrow', msg:`${custName(s.customerId)} — ${s.type}`, date:s.dueDate, ref:s.id, kind:'service', dueToday:false});
  });
  DB.amcs.forEach(a=>{
    if(a.status==='Cancelled') return;
    const d = daysDiff(a.endDate);
    const thresholds = DB.settings.amcReminderDays.slice().sort((x,y)=>x-y);
    if(d<0) list.push({sev:'danger', icon:'shield', title:'AMC expired', msg:`${custName(a.customerId)} — ${a.plan} expired ${fmtDate(a.endDate)}`, date:a.endDate, ref:a.id, kind:'amc', dueToday:false});
    else if(thresholds.includes(d)) list.push({sev:'amber', icon:'shield', title:`AMC expiring in ${d} day${d===1?'':'s'}`, msg:`${custName(a.customerId)} — ${a.plan}`, date:a.endDate, ref:a.id, kind:'amc', dueToday:d===0});
    else if(d<=7) list.push({sev:'amber', icon:'shield', title:'AMC expiring soon', msg:`${custName(a.customerId)} — ${a.plan}, ${d} day(s) left`, date:a.endDate, ref:a.id, kind:'amc', dueToday:false});
  });
  DB.services.forEach(s=>{
    if(s.status==='Completed' && s.paymentStatus==='Pending') list.push({sev:'amber', icon:'clipboard', title:'Payment pending', msg:`${custName(s.customerId)} — ${money(s.totalAmount)} pending for ${s.type}`, date:s.completedAt||s.dueDate, ref:s.id, kind:'payment', dueToday:false});
  });
  DB.services.forEach(s=>{
    if(s.status==='New') list.push({sev:'teal', icon:'clipboard', title:'New service request', msg:`${custName(s.customerId)} — ${s.complaint||s.type}`, date:s.requestDate, ref:s.id, kind:'request', dueToday:false});
  });
  list.forEach(n=>{ n.id = `${n.kind}:${n.ref}:${n.title}`.replace(/\s+/g,'_'); n.read = !!DB.notificationsRead[n.id]; n.dismissed = !!DB.notificationsDismissed[n.id]; });
  return list.filter(n=>!n.dismissed);
  list.sort((a,b)=> (a.date<b.date?-1:1));
  return list;
}
function toggleNotifRead(id){ DB.notificationsRead[id] = !DB.notificationsRead[id]; persist(); render(); }
function markAllNotifsRead(){ buildNotifications().forEach(n=>{ DB.notificationsRead[n.id]=true; }); persist(); toast('All notifications marked read'); render(); }
function dismissNotification(id){ if(!id)return; DB.notificationsDismissed[id]=true; persist(); toast('Notification dismissed'); render(); }

/* ---------------- DASHBOARD ---------------- */
function viewDashboard(){
  const svc = DB.services;
  const totalCust = DB.customers.length;
  const activeCust = DB.customers.filter(c=>c.status==='Active').length;
  const totalRO = DB.roMachines.length;
  const activeAMC = DB.amcs.filter(a=>amcStatus(a)==='Active').length;
  const expiringAMC = DB.amcs.filter(a=>amcStatus(a)==='Expiring Soon').length;
  const dueToday = svc.filter(isDueToday).length;
  const dueTomorrow = svc.filter(isDueTomorrow).length;
  const overdue = svc.filter(isOverdue).length;
  const openReq = svc.filter(s=>['New','Pending'].includes(s.status)).length;
  const assigned = svc.filter(s=>['Assigned','Scheduled','On the Way'].includes(s.status)).length;
  const completed = svc.filter(s=>s.status==='Completed').length;
  const pendingPay = svc.filter(s=>s.paymentStatus==='Pending' && s.status==='Completed').reduce((a,s)=>a+Number(s.totalAmount||0),0);
  const totalRevenue = svc.filter(s=>s.paymentStatus==='Paid').reduce((a,s)=>a+Number(s.totalAmount||0),0);
  const thisMonth = todayISO().slice(0,7);
  const monthlyRevenue = svc.filter(s=>s.paymentStatus==='Paid' && (s.completedAt||'').slice(0,7)===thisMonth).reduce((a,s)=>a+Number(s.totalAmount||0),0);

  const cards = [
    ['Total Customers', totalCust, ''],
    ['Active Customers', activeCust, 'good'],
    ['Total RO Machines', totalRO, ''],
    ['Active AMC', activeAMC, 'good'],
    ['AMC Expiring Soon', expiringAMC, expiringAMC?'warn':''],
    ['Services Due Today', dueToday, dueToday?'warn':''],
    ['Services Due Tomorrow', dueTomorrow, ''],
    ['Overdue Services', overdue, overdue?'danger':''],
    ['Open Service Requests', openReq, openReq?'warn':''],
    ['Assigned Services', assigned, ''],
    ['Completed Services', completed, 'good'],
    ['Pending Payments', money(pendingPay), pendingPay?'warn':''],
    ['Total Revenue', money(totalRevenue), 'good'],
    ['Monthly Revenue', money(monthlyRevenue), 'good'],
  ];

  // monthly service count last 6 months
  const months=[];
  for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
  const counts = months.map(m=> svc.filter(s=>(s.completedAt||s.scheduledDate||'').slice(0,7)===m).length);
  const maxCount = Math.max(1,...counts);
  const revByMonth = months.map(m=> svc.filter(s=>s.paymentStatus==='Paid' && (s.completedAt||'').slice(0,7)===m).reduce((a,s)=>a+Number(s.totalAmount||0),0));
  const maxRev = Math.max(1,...revByMonth);

  const statusCounts = {};
  svc.forEach(s=>{ statusCounts[s.status]=(statusCounts[s.status]||0)+1; });
  const statusColors = {New:'#6B7A80',Pending:'#6B7A80',Scheduled:'#0EA5B7',Assigned:'#0EA5B7','On the Way':'#0EA5B7','In Progress':'#B4690E','Waiting for Parts':'#B4690E',Completed:'#1E7A46',Cancelled:'#C23A2E',Rescheduled:'#B4690E','Customer Not Available':'#C23A2E'};
  const donutStops = [];
  let acc=0;
  const total = svc.length||1;
  Object.entries(statusCounts).forEach(([k,v])=>{ const pct=v/total*100; donutStops.push(`${statusColors[k]||'#999'} ${acc}% ${acc+pct}%`); acc+=pct; });

  return `
  <div class="cards-row">
    ${cards.map(([l,v,cls])=>`<div class="stat-card ${cls}"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('')}
  </div>
  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><h2>Monthly service count</h2></div>
      <div class="panel-body">
        <div class="bars">
          ${months.map((m,i)=>`<div class="bar-col"><div class="val">${counts[i]}</div><div class="bar" style="height:${counts[i]/maxCount*100}%"></div><div class="lbl">${new Date(m+'-01').toLocaleDateString('en-IN',{month:'short'})}</div></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Monthly revenue</h2></div>
      <div class="panel-body">
        <div class="bars">
          ${months.map((m,i)=>`<div class="bar-col"><div class="val">₹${(revByMonth[i]/1000).toFixed(1)}k</div><div class="bar" style="height:${revByMonth[i]/maxRev*100}%; background:var(--aqua)"></div><div class="lbl">${new Date(m+'-01').toLocaleDateString('en-IN',{month:'short'})}</div></div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><h2>Service status distribution</h2></div>
      <div class="panel-body">
        <div class="donut-wrap">
          <div class="donut" style="background:conic-gradient(${donutStops.join(',')})"></div>
          <div class="legend">${Object.entries(statusCounts).map(([k,v])=>`<div class="li"><span class="dot" style="background:${statusColors[k]||'#999'}"></span>${k} — ${v}</div>`).join('')}</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>AMC expiry trend (next 6 months)</h2></div>
      <div class="panel-body">
        <div class="bars">
        ${(()=>{ const m2=[]; for(let i=0;i<6;i++){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+i); m2.push(d.toISOString().slice(0,7)); }
          const c2 = m2.map(m=>DB.amcs.filter(a=>a.status!=='Cancelled' && a.endDate.slice(0,7)===m).length);
          const mx=Math.max(1,...c2);
          return m2.map((m,i)=>`<div class="bar-col"><div class="val">${c2[i]}</div><div class="bar" style="height:${c2[i]/mx*100}%; background:var(--amber)"></div><div class="lbl">${new Date(m+'-01').toLocaleDateString('en-IN',{month:'short'})}</div></div>`).join(''); })()}
        </div>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Technician performance (completed jobs)</h2></div>
    <div class="panel-body">
      <div class="table-wrap"><table><thead><tr><th>Technician</th><th>Assigned</th><th>Completed</th><th>Overdue in queue</th></tr></thead><tbody>
        ${DB.technicians.map(t=>{ const mine=svc.filter(s=>s.technicianId===t.id); const comp=mine.filter(s=>s.status==='Completed').length; const ov=mine.filter(isOverdue).length;
          return `<tr><td><strong>${t.name}</strong></td><td>${mine.length}</td><td>${comp}</td><td>${ov?`<span class="badge b-red">${ov}</span>`:'0'}</td></tr>`; }).join('')}
      </tbody></table></div>
    </div>
  </div>
  <div class="panel-head" style="border:none;padding:0 0 10px"><h2 style="font-size:16px">Quick actions</h2></div>
  <div class="search-row" style="margin-bottom:20px">
    <button class="btn primary" data-action="add-customer">${ic('plus')} Add Customer</button>
    <button class="btn primary" data-action="add-ro">${ic('plus')} Add RO</button>
    <button class="btn primary" data-action="add-service">${ic('plus')} Create Service</button>
    <button class="btn primary" data-action="add-amc">${ic('plus')} Create AMC</button>
    <button class="btn" data-action="nav" data-view="technicians">${ic('tech')} Assign Technician</button>
  </div>`;
}

/* ---------------- SERVICES ---------------- */
function viewServices(requestsOnly){
  const q = STATE.filters.services.toLowerCase();
  let rows = DB.services.filter(s=> !q || [custName(s.customerId),s.type,s.complaint].join(' ').toLowerCase().includes(q));
  if(requestsOnly) rows = rows.filter(s=>['New','Pending'].includes(s.status));
  if(STATE.filters.servicesStatus) rows = rows.filter(s=>s.status===STATE.filters.servicesStatus);
  rows = rows.slice().sort((a,b)=> (a.dueDate||a.requestDate||'').localeCompare(b.dueDate||b.requestDate||''));
  const statusOpts = ['New','Pending','Scheduled','Assigned','On the Way','In Progress','Waiting for Parts','Completed','Cancelled','Rescheduled','Customer Not Available'];
  return `
  <div class="panel">
    <div class="panel-head"><h2>${requestsOnly?'Service Requests':'All Services'} (${rows.length})</h2><button class="btn primary" data-action="add-service">${ic('plus')} ${requestsOnly?'New Request':'Create Service'}</button></div>

/* ---------------- CALENDAR ---------------- */
function viewCalendar(){
  const y = STATE.calYear, m = STATE.calMonth;
  const first = new Date(y,m,1); const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !==0) cells.push(null);

  function eventsFor(dateISO){
    const evs=[];
    DB.services.forEach(s=>{ if(s.dueDate===dateISO && !['Completed','Cancelled'].includes(s.status)) evs.push({label:'🔧 '+custName(s.customerId), cls:isOverdue(s)?'b-red':'b-teal'}); });
    DB.services.forEach(s=>{ if(s.status==='Completed' && s.completedAt && s.completedAt.slice(0,10)===dateISO) evs.push({label:'✅ '+custName(s.customerId), cls:'b-green'}); });
    DB.amcs.forEach(a=>{ if(a.endDate===dateISO && a.status!=='Cancelled') evs.push({label:'📅 AMC: '+custName(a.customerId), cls:'b-amber'}); });
    DB.roMachines.forEach(r=>{ if(r.installDate===dateISO) evs.push({label:'🏠 Install: '+custName(r.customerId), cls:'b-slate'}); });
    return evs;
  }
  const monthLabel = first.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const todayStr = todayISO();

  const selDate = STATE.calSelected;
  const selEvents = selDate ? eventsFor(selDate) : [];

  return `
  <div class="panel">
    <div class="panel-head">
      <h2>${monthLabel}</h2>
      <div class="search-row"><button class="icon-btn" data-action="cal-prev">${ic('chevL')}</button><button class="btn sm" data-action="cal-today">Today</button><button class="icon-btn" data-action="cal-next">${ic('chevR')}</button></div>
    </div>
    <div class="panel-body">
      <div class="cal-grid">
        ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(d=>{
          if(d===null) return `<div class="cal-cell other-month"></div>`;
          const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const evs = eventsFor(iso);
          return `<div class="cal-cell ${iso===todayStr?'today':''}" data-action="cal-day" data-date="${iso}">
            <div class="dnum">${d}</div>
            ${evs.slice(0,3).map(e=>`<span class="cal-dot badge ${e.cls}">${e.label}</span>`).join('')}
            ${evs.length>3?`<div class="muted" style="font-size:10px">+${evs.length-3} more</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
  ${selDate ? `<div class="panel"><div class="panel-head"><h2>${fmtDate(selDate)}</h2></div><div class="panel-body">
    ${selEvents.length? selEvents.map(e=>`<div class="svc-card" style="margin-bottom:8px"><span class="badge ${e.cls}">${e.label}</span></div>`).join('') : `<div class="muted">No events on this day.</div>`}
  </div></div>` : ''}
  <div class="muted" style="font-size:12px">🔧 Service due &nbsp; ✅ Completed &nbsp; 📅 AMC expiry &nbsp; 🏠 Installation</div>`;
}

  const sevMap = {danger:'b-red', amber:'b-amber', teal:'b-teal'};
  return `
  <div class="panel">
    <div class="panel-head">
      <h2>Notification Center</h2>

    </div>

      <div class="notif-tabs">
        <button class="${filter==='all'?'active':''}" data-action="notif-filter" data-filter="all">All (${all.length})</button>
        <button class="${filter==='unread'?'active':''}" data-action="notif-filter" data-filter="unread">Unread (${unread.length})</button>
        <button class="${filter==='read'?'active':''}" data-action="notif-filter" data-filter="read">Read (${read.length})</button>
      </div>
    </div>
    <div class="panel-body pad0" style="margin-top:12px">
      ${notifs.length? `<div>${notifs.map(n=>`<div class="notif-row ${n.read?'':'unread'}" data-action="notif-toggle-read" data-id="${n.id}">
        <div class="unread-dot ${n.read?'hide':''}"></div>
        <div class="icon-btn" style="cursor:default; color:var(--${n.sev==='danger'?'red':n.sev==='amber'?'amber':'teal'})">${ic(n.icon)}</div>
        <div style="flex:1">
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap"><strong style="font-size:13.5px">${n.title}</strong><span class="badge ${sevMap[n.sev]}">${n.kind}</span></div>
          <div class="muted" style="font-size:12.5px; margin-top:2px">${n.msg}</div>
        </div>
        <div class="muted" style="font-size:11.5px; white-space:nowrap">${fmtDate(n.date)}</div>
        <button class="icon-btn notif-close" data-action="notif-close" data-id="${n.id}" title="Close notification" aria-label="Close notification">${ic('x')}</button>
      </div>`).join('')}</div>` : emptyState('bell', filter==='unread'?'Nothing unread':filter==='read'?'Nothing read yet':'All clear', filter==='all'?'No pending reminders right now.':'')}

  </div>
  <div class="muted" style="font-size:12px">Reminders trigger automatically based on your Settings thresholds for service due dates and AMC expiry. Tap a notification to mark it read or unread.</div>`;
}

/* ---------------- EMPTY STATE ---------------- */
function emptyState(icon,title,sub){
  return `<div class="empty"><div class="big-icon">${ICONS[icon]||''}</div><div style="font-weight:700;color:var(--ink)">${title}</div><div style="font-size:12.5px;margin-top:4px">${sub}</div></div>`;
}
function escAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }

/* ============================= MODALS (forms) ============================= */
function openModal(html){ STATE.modal = html; renderModal(); }
function closeModal(){ STATE.modal = null; renderModal(); }
function renderModal(){
  const root = document.getElementById('modal-root') || document.getElementById('tech-modal-root');
  if(!root) return;
  root.innerHTML = STATE.modal ? `<div class="modal-backdrop" data-action="close-modal-backdrop" role="presentation">${STATE.modal}</div>` : '';
}
function fld(label, name, value, type, opts){
  type = type||'text'; opts = opts||{};
  if(type==='select'){
    return `<div class="field"><label>${label}</label><select name="${name}" ${opts.required?'required':''}>${opts.options.map(o=>{
      const val = typeof o==='object'?o.value:o; const lab = typeof o==='object'?o.label:o;
      return `<option value="${escAttr(val)}" ${String(value)===String(val)?'selected':''}>${lab}</option>`;
    }).join('')}</select></div>`;
  }
  if(type==='textarea'){
    return `<div class="field"><label>${label}</label><textarea name="${name}" rows="${opts.rows||3}" ${opts.required?'required':''}>${value||''}</textarea></div>`;
  }
  return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${escAttr(value)}" ${opts.required?'required':''} ${opts.step?`step="${opts.step}"`:''}></div>`;
}
function modalShell(title, bodyHTML, submitLabel, formAction){
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="AquaFlow dialog">

/* ============================= CRUD HANDLERS ============================= */
function formToObj(form){
  const data = new FormData(form); const o={};
  for(const [k,v] of data.entries()) o[k]=v;
  return o;
}
function handleSubmitCustomer(form){
  const o = formToObj(form);
  if(o.id){ const c=byId(DB.customers,o.id); Object.assign(c,o); toast('Customer updated'); }
  else { o.id=uid('cust'); o.code='CUS-'+(1000+DB.customers.length+1); o.createdAt=todayISO(); DB.customers.push(o); toast('Customer added'); }
  persist(); closeModal(); render();
}
function handleSubmitRO(form){
  const o = formToObj(form);
  if(!o.nextServiceDate && o.lastServiceDate) o.nextServiceDate = addMonths(o.lastServiceDate, freqMonths(o.serviceFrequency));
  if(o.id){ const r=byId(DB.roMachines,o.id); Object.assign(r,o); toast('RO machine updated'); }
  else { o.id=uid('ro'); DB.roMachines.push(o); toast('RO machine added'); }
  persist(); closeModal(); render();
}
function handleSubmitAMC(form){
  const o = formToObj(form);
  o.amount=Number(o.amount||0); o.servicesIncluded=Number(o.servicesIncluded||0); o.servicesUsed=Number(o.servicesUsed||0);
  if(o.id){ const a=byId(DB.amcs,o.id); Object.assign(a,o); toast('AMC updated'); }
  else { o.id=uid('amc'); DB.amcs.push(o); toast('AMC contract created'); }
  persist(); closeModal(); render();
}
function handleSubmitService(form){
  const o = formToObj(form);
  const isNew=!o.id;
  if(o.id){ const s=byId(DB.services,o.id); Object.assign(s,o); toast('Service updated'); }
  else { o.id=uid('svc'); o.workPerformed=''; o.partsUsed=[]; o.laborCost=0; o.partsCost=0; o.additionalCharges=0; o.discount=0; o.totalAmount=0; o.paymentStatus='Pending'; o.paymentMode=''; o.beforePhoto=''; o.afterPhoto=''; o.signature=''; o.completedAt=''; DB.services.push(o); toast(o.technicianId?'Service created and assigned':'Service created'); }
  persist(); closeModal();
  if(isNew && o.technicianId){ STATE.adminView='technicians'; STATE.activeServiceId=null; } else { STATE.adminView='services'; STATE.activeServiceId=null; }
  render();
}
function handleSubmitTech(form){
  const o = formToObj(form);
  if(o.id){ const t=byId(DB.technicians,o.id); Object.assign(t,o); const u=(DB.users||[]).find(x=>x.technicianId===o.id); if(u){u.name=o.name;u.status=o.status;} toast('Technician updated'); }
  else { o.id=uid('tech'); DB.technicians.push(o); const uname=o.name.trim().split(/\s+/)[0].toLowerCase(); const unique = DB.users.some(x=>x.username===uname) ? uname+DB.technicians.length : uname; DB.users.push({id:uid('usr'),username:unique,password:'tech123',role:'technician',technicianId:o.id,name:o.name,status:o.status}); toast('Technician added with login'); }
  persist(); closeModal(); render();
}
function handleSubmitAssign(form){
  const o = formToObj(form);
  const s = byId(DB.services,o.id);
  s.technicianId = o.technicianId; s.scheduledDate = o.scheduledDate; if(s.status==='New'||s.status==='Pending') s.status='Assigned';
  persist(); closeModal(); toast('Technician assigned'); render();
}
function handleSubmitSettings(form){
  const o = formToObj(form);
  DB.settings.companyName = o.companyName;
  DB.settings.serviceReminderDays = o.serviceReminderDays.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n));
  DB.settings.amcReminderDays = o.amcReminderDays.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n));
  persist(); toast('Settings saved'); render();
}
function deleteEntity(kind,id){
  if(!confirm('Remove this record? This cannot be undone.')) return;
  const map = {customer:'customers', ro:'roMachines', amc:'amcs', service:'services', tech:'technicians'};
  if(kind==='customer'){
    const roIds=DB.roMachines.filter(r=>r.customerId===id).map(r=>r.id);
    DB.services=DB.services.filter(x=>x.customerId!==id);
    DB.amcs=DB.amcs.filter(x=>x.customerId!==id);
    DB.roMachines=DB.roMachines.filter(x=>x.customerId!==id);
    DB.customers=DB.customers.filter(x=>x.id!==id);
    if(STATE.activeCustomerId===id) STATE.activeCustomerId=null;
  } else { DB[map[kind]] = DB[map[kind]].filter(x=>x.id!==id); if(kind==='tech') DB.users=DB.users.filter(u=>u.technicianId!==id); }
  persist(); toast('Record removed'); render();
}

/* CSV export */
function exportCSV(name, rows){
  if(!rows || !rows.length){ toast('Nothing to export'); return; }
  const cols = Object.keys(rows[0]).filter(k=>typeof rows[0][k] !== 'object');
  const lines = [cols.join(',')];
  rows.forEach(r=>{ lines.push(cols.map(c=>`"${String(r[c]==null?'':r[c]).replace(/"/g,'""')}"`).join(',')); });
  const blob = new Blob([lines.join('\\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = name.replace(/\\s+/g,'_')+'.csv'; a.click();
  URL.revokeObjectURL(url);
}

async function handleSubmitCompletion(form){
  const o = formToObj(form);
  const s = byId(DB.services,o.id);
  const partsUsed = (o.partsText||'').split('\\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const m = line.match(/^(.*?)\\s*x(\\d+(?:\\.\\d+)?)\\s*@(\\d+(?:\\.\\d+)?)/i);
    if(m) return {name:m[1].trim(), qty:Number(m[2]), cost:Number(m[3])};
    return {name:line, qty:1, cost:0};
  });
  const partsCost = partsUsed.reduce((a,p)=>a+p.qty*p.cost,0);
  const labor = Number(o.laborCost||0), extra=Number(o.additionalCharges||0), disc=Number(o.discount||0);
  s.workPerformed = o.workPerformed; s.partsUsed = partsUsed; s.partsCost = partsCost;
  s.laborCost = labor; s.additionalCharges = extra; s.discount = disc;
  s.totalAmount = Math.max(0, partsCost+labor+extra-disc);
  s.paymentMode = o.paymentMode; s.paymentStatus = o.paymentMode==='Pending' ? 'Pending' : 'Paid';
  s.signature = o.signature; s.status = 'Completed'; s.completedAt = new Date().toISOString();

  const beforeFile = form.querySelector('[name="beforePhotoFile"]').files[0];
  const afterFile = form.querySelector('[name="afterPhotoFile"]').files[0];
  try{
    if(beforeFile) s.beforePhoto = await fileToDataURL(beforeFile);
    if(afterFile) s.afterPhoto = await fileToDataURL(afterFile);
  }catch(e){ /* ignore photo errors */ }

  // update RO next service date + AMC usage
  const ro = roObj(s.roId);
  if(ro){ ro.lastServiceDate = todayISO(); ro.nextServiceDate = addMonths(todayISO(), freqMonths(ro.serviceFrequency)); ro.status='Active';
    const amc = amcForRo(ro.id);
    if(amc && amc.servicesUsed < amc.servicesIncluded) amc.servicesUsed += 1;
  }
  persist(); closeModal(); toast('Service completed'); render();
}

(function AquaFlowV8(){

  const htmlEscape = value => String(value == null ? '' : value)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const safeUrl = value => {
    try {
      const u = new URL(String(value || ''), location.href);
      return ['http:','https:','tel:'].includes(u.protocol) ? u.href : '#';
    } catch (_) { return '#'; }
  };
  window.afEscape = htmlEscape;

  /* ---------- data hygiene ---------- */

    el.title = `Last local save: ${d.toLocaleString('en-IN')}`;

  function normalizeDB(){
    DB.customers = Array.isArray(DB.customers) ? DB.customers : [];

  /* ---------- diagnostics ---------- */
  function runDiagnostics(){

    const techIds=new Set(DB.technicians.map(x=>x.id));

    DB.amcs.forEach(a=>{if(!customerIds.has(a.customerId))issues.push(`AMC ${a.id} references a missing customer.`);if(a.roId&&!roIds.has(a.roId))issues.push(`AMC ${a.id} references a missing RO.`);});
    DB.services.forEach(s=>{if(!customerIds.has(s.customerId))issues.push(`Service ${s.id} references a missing customer.`);if(s.roId&&!roIds.has(s.roId))issues.push(`Service ${s.id} references a missing RO.`);if(s.technicianId&&!techIds.has(s.technicianId))issues.push(`Service ${s.id} references a missing technician.`);});

  /* ---------- keyboard shortcuts ---------- */

  /* ---------- event enhancements ---------- */
  document.addEventListener('change',function(e){
    const target=e.target;

      const ro=target.form?.querySelector('[name="roId"]');
      if(ro) refreshROOptions(target,ro);

    if(target.id==='af-backup-file') return;
  });

  document.addEventListener('input',function(e){
    if(e.target.id==='af-command-search'){
      const q=e.target.value.toLowerCase().trim();
      document.querySelectorAll('.af-command-item').forEach((btn,i)=>btn.classList.toggle('hidden',q && !commandItems[i][0].toLowerCase().includes(q)));
    }
  });

  /* Capture reset/delete clicks before the legacy confirm() path. */
  document.addEventListener('click',function(e){
    const el=e.target.closest('[data-action]'); if(!el) return;
    const action=el.getAttribute('data-action');
    if(action==='delete-customer'||action==='delete-ro'||action==='delete-amc'||action==='delete-service'||action==='delete-tech'){
      e.preventDefault(); e.stopImmediatePropagation();
      const kind=action.replace('delete-',''); deleteEntity(kind,el.getAttribute('data-id')); return;
    }
    if(action==='reset-data'){
      e.preventDefault(); e.stopImmediatePropagation();
      confirmAction('Reset sample data','Replace all local data with the original sample dataset? Your current browser data will be lost unless exported first.','Reset data','reset'); return;
    }
    if(action==='confirm-pending'){
      e.preventDefault(); e.stopImmediatePropagation();
      const p=pendingConfirm; pendingConfirm=null;
      if(p?.action==='delete'){ performDelete(p.meta.kind,p.meta.id); }
      else if(p?.action==='restore'){ applyRestore(); }
      else if(p?.action==='reset'){ DB=seedData(); normalizeDB(); persist(); closeModal(); toast('Sample data restored'); render(); }
      else if(p?.action==='logout'){ STATE.role=null; STATE.userId=null; STATE.username=''; STATE.technicianId=null; closeModal(); render(); }
      return;
    }
    if(action==='open-command-palette'){ openCommandPalette(); return; }

    if(action==='restore-backup-open'){ openRestore(); return; }
    if(action==='restore-backup'){ restoreBackup(); return; }
    if(action==='diagnostics'){ showDiagnostics(); return; }
    if(action==='print-service'){ printService(el.getAttribute('data-id')); return; }
    if(action==='service-progress'){ progressService(el.getAttribute('data-id')); return; }
  }, true);

  /* ---------- enhanced settings view ---------- */
  viewSettings=function(){
    const s=DB.settings;

        <div class="search-row">
          <button class="btn" data-action="export-json">${ic('download')} Export JSON</button>
          <button class="btn" data-action="restore-backup-open">${ic('download')} Restore JSON</button>
          <button class="btn" data-action="diagnostics">${ic('shield')} Run diagnostics</button>
          <button class="btn danger" data-action="reset-data">${ic('trash')} Reset sample data</button>
        </div>
        <div class="muted" style="font-size:11px;margin-top:12px">Last local save: ${window.__afLastSaved.toLocaleString('en-IN')}</div>
      </div>
    </div>`;
  };

  /* ---------- patch admin shell after every render ---------- */
  const baseRender=render;
  render=function(){
    baseRender();
    requestAnimationFrame(()=>{
      updateSaveIndicator();
      if(document.querySelector('.topbar .actions') && !document.getElementById('af-command-btn')){
        const actions=document.querySelector('.topbar .actions');
        const b=document.createElement('button'); b.id='af-command-btn'; b.className='icon-btn'; b.type='button'; b.dataset.action='open-command-palette'; b.title='Quick navigation (Ctrl+K)'; b.setAttribute('aria-label','Quick navigation'); b.innerHTML=ic('search'); actions.prepend(b);
      }
      if(document.querySelector('.topbar .actions') && !document.getElementById('af-save-status')){
        const span=document.createElement('span'); span.id='af-save-status'; span.className='af-save-status'; span.textContent='Saved locally'; document.querySelector('.topbar .actions').prepend(span);
      }
      document.querySelectorAll('[data-action="view-service"]').forEach(row=>{
        const id=row.getAttribute('data-id');
        if(row.querySelector('[data-action="print-service"]')) return;
      });

  };

  /* ---------- inject action controls into service detail ---------- */
  const baseViewServiceDetail=viewServiceDetail;
  viewServiceDetail=function(id,mode){
    let html=baseViewServiceDetail(id,mode);
    const s=byId(DB.services,id);

  const baseGateHTML=gateHTML;

  };

  /* ---------- add a small global offline/local indicator ---------- */
  window.addEventListener('online',()=>toast('Connection restored')); window.addEventListener('offline',()=>toast('Offline mode — local data continues to work'));

  /* ---------- final initialization ---------- */
  try { DB.version=APP_VERSION; DB.meta=DB.meta||{}; DB.meta.updatedAt=DB.meta.updatedAt||new Date().toISOString(); } catch(_){ }
})();

  persist = function(){ originalPersist(); queueSync(); };
  function queueSync(){ if(!serverOnline || !STATE.role) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync,500); }
  async function sync(){ if(syncing||!serverOnline||!STATE.role)return; syncing=true; document.body.classList.add('af-syncing'); try{await api('/sync',{method:'POST',body:JSON.stringify({data:DB})}); window.__afLastSaved=new Date();}catch(e){serverOnline=false;window.AquaFlow.serverMode=false;} finally{syncing=false;document.body.classList.remove('af-syncing'); updateSaveIndicator?.();}}
  const localLogin = loginUser;
  loginUser = async function(form){
    const data=formToObj(form); const role=data.role||STATE.loginRole||'admin'; const username=String(data.username||'').trim(), password=String(data.password||'');
    if(!username||!password){toast('Enter user ID and password');return;}
    try{
      if(await probe()){
        const out=await loginServer(username,password,role);
        STATE.role=out.user.role; STATE.loginRole=out.user.role; STATE.userId=out.user.id; STATE.username=out.user.username; STATE.technicianId=out.user.technician_id||null;
        await pull(); STATE.adminView='dashboard';STATE.techView='today';STATE.activeCustomerId=null;STATE.activeServiceId=null;STATE.activeTechServiceId=null;STATE.sidebarOpen=false;
        toast('Signed in securely'); render(); return;
      }
    }catch(e){ toast(e.message||'Server login failed'); return; }
    // Explicit local demo fallback only when API is unavailable.
    localLogin(form);
  };
  const originalLogout = ()=>{};
  document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); if(STATE.role) openCommandPalette();} });
  window.AquaFlowV9={probe,pull,sync,api,get serverOnline(){return serverOnline;}};
  // Restore CSRF token from prior same-tab session and expose a server status pill.
  csrf=sessionStorage.getItem('aquaflow_csrf')||'';
  const oldRender=render;
  render=function(){oldRender();requestAnimationFrame(()=>{
    const actions=document.querySelector('.topbar .actions'); if(actions&&!document.getElementById('af-server-pill')){const p=document.createElement('span');p.id='af-server-pill';p.className='af-server-pill '+(serverOnline?'online':'offline');p.innerHTML='<span class="dot"></span><span>'+ (serverOnline?'Server connected':'Local mode')+'</span>';actions.prepend(p);}
    const p=document.getElementById('af-server-pill'); if(p){p.className='af-server-pill '+(serverOnline?'online':'offline');p.innerHTML='<span class="dot"></span><span>'+ (serverOnline?'Server connected':'Local mode')+'</span>';}
  });};
  // Probe without blocking first paint; authenticated sessions are restored from cookie.
  (async()=>{try{if(await probe()){try{const me=await api('/auth/me'); if(me?.user){csrf=sessionStorage.getItem('aquaflow_csrf')||'';STATE.role=me.user.role;STATE.loginRole=me.user.role;STATE.userId=me.user.id;STATE.username=me.user.username;STATE.technicianId=me.user.technician_id||null;await pull();}}catch(_){}}}catch(_){} finally{render();}})();
})();

</script>
